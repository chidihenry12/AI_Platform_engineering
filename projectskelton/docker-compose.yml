services:
  nginx:
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
      - ai-service

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=mydb
      - PG_USER=myuser
      - PG_PASSWORD=mypassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_URL=http://ai-service:8001
    depends_on:
      - postgres
      - redis
      - ai-service

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_DB=mydb
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
